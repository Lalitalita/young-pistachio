# Cyber Parcours : tout tient dans ce compose. Variables lues depuis .env.
name: cyber-parcours

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Bridge + port publié : l'IP source des téléphones est conservée (DNAT, pas de proxy).
      # Vérifie avec /api/whoami depuis un téléphone (doit afficher 192.168.x.x, pas 172.x).
      - "${HTTP_PORT:-80}:8000"
    volumes:
      - app-data:/data
    networks: [front, demo, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 4s
      retries: 3

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    # DNS uniquement : le DHCP reste sur la box 5G.
    environment:
      TZ: ${TZ:-Europe/Paris}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAM_DNS:-1.1.1.1}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_WEB_PORT:-8081}:80/tcp"
    volumes:
      - pihole-etc:/etc/pihole
    networks: [front, internal]

  chaos-agent:
    # Étape 4 : stop/start des conteneurs de démo uniquement. Pour l'instant, simple squelette.
    build: ./chaos-agent
    restart: unless-stopped
    environment:
      CHAOS_TOKEN: ${CHAOS_TOKEN}
    # Aucun port publié : joignable seulement depuis le réseau interne.
    networks: [internal]

  demo-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./demo/web:/usr/share/nginx/html:ro
    networks: [demo]

  demo-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    networks: [demo]

  demo-api:
    build: ./demo/api
    restart: unless-stopped
    networks: [demo]

networks:
  front: {}
  # Réseau interne (pas de sortie Internet, non joignable de l'extérieur) : app <-> chaos-agent.
  internal:
    internal: true
  demo: {}

volumes:
  app-data: {}
  pihole-etc: {}
