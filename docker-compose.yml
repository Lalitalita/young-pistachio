# Cyber Parcours : tout tient dans ce compose. Variables lues depuis .env.
name: cyber-parcours

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Bridge + port publié : l'IP source des téléphones est conservée (DNAT, pas de proxy).
      # Vérifie avec /api/whoami depuis un téléphone (doit afficher 192.168.x.x, pas 172.x).
      - "${HTTP_PORT:-80}:8000"
    volumes:
      - app-data:/data
    networks: [front, demo, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 4s
      retries: 3

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    # DNS uniquement : le DHCP reste sur la box 5G.
    environment:
      TZ: ${TZ:-Europe/Paris}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAM_DNS:-1.1.1.1}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_WEB_PORT:-8081}:80/tcp"
    volumes:
      - pihole-etc:/etc/pihole
    networks: [front, internal]

  chaos-agent:
    # Coupe / relance (stop/start) les 3 conteneurs de démo, rien d'autre. Voir chaos-agent/agent.py.
    build: ./chaos-agent
    restart: unless-stopped
    environment:
      CHAOS_TOKEN: ${CHAOS_TOKEN}
      DOCKER_HOST_NAME: docker-proxy
    # Aucun port publié : joignable seulement depuis le réseau interne (app) ; Docker via le proxy.
    networks: [internal, dockerapi]
    depends_on: [docker-proxy]

  # Le socket Docker n'est monté QUE ici, en lecture seule, et filtré : conteneurs, start/stop uniquement.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerapi]

  demo-web:
    image: nginx:1.27-alpine
    container_name: cp-demo-web
    restart: unless-stopped  # un arrêt volontaire (panne « boss ») n'est pas relancé par Docker : c'est le chaos-agent qui s'en charge
    volumes:
      - ./demo/web:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [demo]

  demo-db:
    image: postgres:16-alpine
    container_name: cp-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    networks: [demo]

  demo-api:
    build: ./demo/api
    container_name: cp-demo-api
    restart: unless-stopped
    networks: [demo]

networks:
  front: {}
  # Réseau interne (pas de sortie Internet, non joignable de l'extérieur) : app <-> chaos-agent.
  internal:
    internal: true
  demo: {}
  # Entre le chaos-agent et le docker-socket-proxy uniquement.
  dockerapi:
    internal: true

volumes:
  app-data: {}
  pihole-etc: {}
